name: Keep streak

on:
  schedule:
    - cron: "45 5 * * *"   # every day at 11:15 AM IST
  workflow_dispatch:        # lets you run it manually to test

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set commit author
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Refresh and revert the project activity marker
        run: |
          FILE=README.md
          # Create a harmless, traceable activity commit without changing project content.
          printf '\n<!-- Zero-Wait CI activity marker: %s -->\n' "$(date -u +%F)" >> "$FILE"
          git add $FILE
          git commit -m "ci(zero-wait): refresh activity marker"

          # Revert the marker so the working tree remains unchanged.
          git revert --no-edit HEAD

      - name: Push
        run: git push
